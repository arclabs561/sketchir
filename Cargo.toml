[package]
name = "sketchir"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Sketching primitives for IR: minhash/simhash/LSH-style signatures."
repository = "https://github.com/arclabs561/sketchir"
homepage = "https://github.com/arclabs561/sketchir"
documentation = "https://docs.rs/sketchir"
readme = "README.md"
publish = true
keywords = ["minhash", "simhash", "lsh", "info-retrieval"]
categories = ["text-processing", "algorithms"]

[workspace]

[features]
# SIMD slot-Hamming / bit-Hamming via innr (runtime AVX-512/AVX2/NEON). Off by
# default so the scalar fallback keeps MSRV 1.80; innr raises the x86_64 MSRV
# to 1.89 (AVX-512 intrinsics) when enabled.
innr = ["dep:innr"]
# Optional serde derives on signatures/generators (persist build-once artifacts).
serde = ["dep:serde"]
# `store` adds an updatable, durable near-duplicate index (`store::UpdatableIndex`)
# via segstore.
store = ["serde", "dep:segstore", "dep:durability"]

[dependencies]
serde = { version = "1.0", optional = true, features = ["derive"] }
innr = { version = "0.6", optional = true }
segstore = { version = "0.2", optional = true }
durability = { version = "0.6", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[profile.bench]
lto = "thin"
codegen-units = 1

[[bench]]
name = "hash_bench"
path = "benches/hash_bench.rs"
harness = false

