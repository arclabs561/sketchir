[package]
name = "sketchir"
version = "0.3.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Sketching primitives for IR: minhash/simhash/LSH-style signatures."
repository = "https://github.com/arclabs561/sketchir"
homepage = "https://github.com/arclabs561/sketchir"
documentation = "https://docs.rs/sketchir"
readme = "README.md"
publish = true
keywords = ["minhash", "simhash", "lsh", "info-retrieval"]
categories = ["text-processing", "algorithms"]

[workspace]

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[profile.bench]
lto = "thin"
codegen-units = 1

[[bench]]
name = "hash_bench"
path = "benches/hash_bench.rs"
harness = false

